# ==============================================================================
# CRAWLER CONFIGURATION - URLs TO SCRAPE
# ==============================================================================
#
# This file defines which websites/pages the crawler will scrape.
# Each job runs independently and stores output in S3.
#
# HOW TO ADD A NEW URL TO CRAWL:
# ------------------------------
# Add a new entry under 'crawl_jobs:' with these fields:
#
#   - name: "unique-job-name"           # Used as job ID prefix (no spaces)
#     source_url: "https://example.com/path"  # Starting URL
#     max_pages: 500                    # Max pages to scrape (99999 = unlimited)
#     max_depth: 3                      # How many link-hops from source_url
#     scope_type: "path"                # URL filtering (see below)
#     pdf_scope: "all"                  # PDF download scope
#     doc_scope: "all"                  # Office doc download scope
#     use_browser: "auto"               # Browser mode (optional)
#
# SCOPE TYPES:
# ------------
#   path       - Only URLs under same path prefix (e.g., /snap/*)
#   host       - All URLs on same domain (e.g., all of fns.usda.gov)
#   subdomains - Domain + all subdomains (e.g., *.usda.gov)
#   all        - No URL filtering (follow all links)
#   none       - Skip markdown, only download PDFs/docs
#
# BROWSER MODES:
# --------------
#   auto - Try HTTP first, switch to browser if JS detected (default)
#   on   - Always use browser (for known JS-heavy sites)
#   off  - Never use browser (fastest, but fails on JS sites)
#
# ==============================================================================

crawl_jobs:
  # --------------------------------------------------------------------------
  # USDA Main Site
  # --------------------------------------------------------------------------
  - name: "usda-about"
    source_url: "https://www.usda.gov/about-usda"
    max_pages: 99999
